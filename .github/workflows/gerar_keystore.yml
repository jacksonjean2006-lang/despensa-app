name: Gerar Keystore de Release

# Workflow de USO ÚNICO - roda manualmente uma vez só, gera a chave de
# assinatura (que precisa ficar ESTÁVEL pra sempre - trocar ela depois
# muda o ANDROID_ID de quem já instalou o app e quebra a licença). Depois
# de configurar os secrets a partir do resultado, este arquivo pode ser
# apagado do repositório.
on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Nome do alias da chave (guarde, vai virar o secret KEY_ALIAS)'
        required: true
        default: 'chave_minha_despensa'
      nome_comum:
        description: 'Seu nome (CN do certificado - não precisa ser exato)'
        required: true
        default: 'Jean'

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gerar keystore com senhas aleatórias
        run: |
          STOREPASS=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
          KEYPASS=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)

          keytool -genkeypair -v \
            -keystore release-keystore.jks \
            -alias "${{ inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STOREPASS" \
            -keypass "$KEYPASS" \
            -dname "CN=${{ inputs.nome_comum }}, OU=Dev, O=Minha Despensa, L=Rio de Janeiro, S=RJ, C=BR"

          BASE64=$(base64 -w0 release-keystore.jks)

          {
            echo "## 🔑 Copie estes 4 valores para os Secrets do repositório"
            echo ""
            echo "Vá em **Settings → Secrets and variables → Actions → New repository secret** e crie um secret pra cada linha abaixo (nome à esquerda, valor à direita):"
            echo ""
            echo "### KEYSTORE_PASSWORD"
            echo '```'
            echo "$STOREPASS"
            echo '```'
            echo ""
            echo "### KEY_PASSWORD"
            echo '```'
            echo "$KEYPASS"
            echo '```'
            echo ""
            echo "### KEY_ALIAS"
            echo '```'
            echo "${{ inputs.key_alias }}"
            echo '```'
            echo ""
            echo "### KEYSTORE_BASE64"
            echo '```'
            echo "$BASE64"
            echo '```'
            echo ""
            echo "⚠️ **Depois de copiar os 4 valores pros Secrets:**"
            echo "1. Apague este workflow (\`.github/workflows/gerar_keystore.yml\`) do repositório."
            echo "2. Nunca rode ele de novo gerando uma chave NOVA - isso trocaria a chave de assinatura e quebraria o ANDROID_ID de quem já tem o app instalado."
            echo "3. Guarde os 4 valores também em algum lugar seguro fora do GitHub (ex: gerenciador de senhas), como backup - se perder o secret KEYSTORE_BASE64 sem backup, nunca mais consegue assinar uma atualização compatível com o que já foi instalado."
          } >> "$GITHUB_STEP_SUMMARY"
